<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="banner-title banner-desc">
<title id="banner-title">Deepfake detector: 15 models, 3 families</title>
<desc id="banner-desc">Synergy '26 Deepfake ML Hackathon, IIIT Bangalore. Team Claude laggye: Kanav Bhardwaj, Bhavya Jain, Nirbhay Sharma, Aaryan Antala. A 15-model ensemble, 5 seeds each of ConvNeXt-T, DeiT3-S and ResNet-50D, all ImageNet-pretrained: held-out AUC 0.9119, F1 0.886, and 3,000 test images in about 75 s on an NVIDIA T4. The rescaled scores are averaged into the probability that the image is fake, with a label cut-off of 0.475.</desc>
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4fd1e0" stop-opacity="0.16"/><stop offset="1" stop-color="#4fd1e0" stop-opacity="0"/></radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4fd1e0"/><stop offset="0.35" stop-color="#2a78d6"/><stop offset="0.55" stop-color="#1baf7a"/><stop offset="0.75" stop-color="#eb6834"/><stop offset="1" stop-color="#f5a524"/></linearGradient>
<clipPath id="frame"><rect width="1280" height="320" rx="16"/></clipPath>
<marker id="tip" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4fd1e0"/></marker>
</defs>
<g clip-path="url(#frame)">
<rect width="1280" height="320" fill="#0b1016"/>
<rect width="1280" height="320" fill="url(#dots)"/>
<ellipse cx="1010" cy="160" rx="300" ry="190" fill="url(#glow)"/>
<rect y="314" width="1280" height="6" fill="url(#rule)"/>
<rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="none" stroke="#1f2a37"/>
</g>

<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="64" y="62" fill="#4fd1e0" font-size="14" font-weight="600" letter-spacing="2.2" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">SYNERGY '26 DEEPFAKE ML HACKATHON · IIIT BANGALORE</text>
<text x="62" y="122" fill="#f0f4f8" font-size="50" font-weight="700">Deepfake detector:</text>
<text x="62" y="178" fill="#f0f4f8" font-size="50" font-weight="700"><tspan fill="#f5a524">15 models</tspan>, 3 families</text>
<text x="64" y="216" fill="#9aa7b4" font-size="18">5 seeds each of ConvNeXt-T, DeiT3-S and ResNet-50D, ImageNet-pretrained</text>
<text x="64" y="244" fill="#4fd1e0" font-size="18" font-weight="600">Held-out AUC 0.9119  ·  F1 0.886  ·  3,000 test images in about 75 s on a T4</text>
<text x="64" y="284" fill="#6f7d8c" font-size="13" font-weight="600" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">TEAM</text>
<text x="112" y="285" fill="#f0f4f8" font-size="18" font-weight="600">Claude laggye</text>
<text x="246" y="285" fill="#9aa7b4" font-size="15">Kanav Bhardwaj, Bhavya Jain, Nirbhay Sharma, Aaryan Antala</text>
<rect x="234" y="271" width="1" height="18" fill="#2c3946"/>
</g>

<!-- input: an abstract 224x224 crop drawn as a grid of grey cells -->
<g transform="translate(796,110)">
<rect x="-6" y="-6" width="112" height="112" rx="10" fill="none" stroke="#4fd1e0" stroke-opacity="0.55"/>
<g fill="#c9d3dc">
<rect x="0" y="0" width="22" height="22" rx="3" fill-opacity="0.18"/><rect x="26" y="0" width="22" height="22" rx="3" fill-opacity="0.30"/><rect x="52" y="0" width="22" height="22" rx="3" fill-opacity="0.24"/><rect x="78" y="0" width="22" height="22" rx="3" fill-opacity="0.14"/>
<rect x="0" y="26" width="22" height="22" rx="3" fill-opacity="0.28"/><rect x="26" y="26" width="22" height="22" rx="3" fill-opacity="0.55"/><rect x="52" y="26" width="22" height="22" rx="3" fill-opacity="0.62"/><rect x="78" y="26" width="22" height="22" rx="3" fill-opacity="0.22"/>
<rect x="0" y="52" width="22" height="22" rx="3" fill-opacity="0.20"/><rect x="26" y="52" width="22" height="22" rx="3" fill-opacity="0.66"/><rect x="52" y="52" width="22" height="22" rx="3" fill-opacity="0.48"/><rect x="78" y="52" width="22" height="22" rx="3" fill-opacity="0.26"/>
<rect x="0" y="78" width="22" height="22" rx="3" fill-opacity="0.12"/><rect x="26" y="78" width="22" height="22" rx="3" fill-opacity="0.34"/><rect x="52" y="78" width="22" height="22" rx="3" fill-opacity="0.30"/><rect x="78" y="78" width="22" height="22" rx="3" fill-opacity="0.16"/>
</g>
<text x="50" y="136" fill="#9aa7b4" font-size="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">224 x 224 face</text>
</g>

<!-- fan-out to the three families -->
<g fill="none" stroke="#4fd1e0" stroke-opacity="0.45" stroke-width="1.4">
<path d="M908,160 C930,160 930,110 952,110"/>
<path d="M908,160 H952"/>
<path d="M908,160 C930,160 930,210 952,210"/>
</g>

<!-- 3 families x 5 seeds -->
<g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#c9d3dc">
<text x="956" y="94">ConvNeXt-T</text>
<text x="956" y="144">DeiT3-S</text>
<text x="956" y="194">ResNet-50D</text>
</g>
<g fill="#2a78d6"><rect x="956" y="102" width="16" height="16" rx="4"/><rect x="978" y="102" width="16" height="16" rx="4"/><rect x="1000" y="102" width="16" height="16" rx="4"/><rect x="1022" y="102" width="16" height="16" rx="4"/><rect x="1044" y="102" width="16" height="16" rx="4"/></g>
<g fill="#eb6834"><rect x="956" y="152" width="16" height="16" rx="4"/><rect x="978" y="152" width="16" height="16" rx="4"/><rect x="1000" y="152" width="16" height="16" rx="4"/><rect x="1022" y="152" width="16" height="16" rx="4"/><rect x="1044" y="152" width="16" height="16" rx="4"/></g>
<g fill="#1baf7a"><rect x="956" y="202" width="16" height="16" rx="4"/><rect x="978" y="202" width="16" height="16" rx="4"/><rect x="1000" y="202" width="16" height="16" rx="4"/><rect x="1022" y="202" width="16" height="16" rx="4"/><rect x="1044" y="202" width="16" height="16" rx="4"/></g>

<!-- fan-in to the mean -->
<g fill="none" stroke="#4fd1e0" stroke-opacity="0.45" stroke-width="1.4">
<path d="M1066,110 C1088,110 1086,160 1104,160"/>
<path d="M1066,160 H1104"/>
<path d="M1066,210 C1088,210 1086,160 1104,160"/>
</g>
<circle cx="1130" cy="160" r="26" fill="#0f1a24" stroke="#4fd1e0" stroke-width="1.6"/>
<text x="1130" y="165" fill="#4fd1e0" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">mean</text>
<text x="1130" y="122" fill="#9aa7b4" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">rescaled</text>
<path d="M1156,160 H1165" fill="none" stroke="#4fd1e0" stroke-width="1.4" marker-end="url(#tip)"/>

<!-- output -->
<rect x="1168" y="140" width="78" height="40" rx="8" fill="#f5a524"/>
<text x="1207" y="166" fill="#0b1016" font-size="14" font-weight="700" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">P(fake)</text>
<text x="1207" y="206" fill="#f5a524" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace">cut-off 0.475</text>
</svg>
