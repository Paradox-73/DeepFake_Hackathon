<text x="534.0" y="164.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">all 7,000, same recipe</text>
<text x="534.0" y="176.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">fixed stop epoch</text>
