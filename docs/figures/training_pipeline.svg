<rect x="20" y="60" width="124" height="72" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
<rect x="28" y="66" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="42.0" y="75" fill="#4f5d75" fill-opacity="0.85" font-size="7" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
<text x="82.0" y="97.0" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, 'Segoe UI', Arial, sans-serif" text-anchor="middle">Grouped folds</text>
