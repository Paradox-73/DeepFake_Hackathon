<text x="534.0" y="68.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">mixup, damage, shrink</text>
<text x="534.0" y="80.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">scores, stats, cut-off</text>
<rect x="460" y="108" width="148" height="72" rx="6" fill="#f5f5f5"/>
<rect x="460" y="108" width="148" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
