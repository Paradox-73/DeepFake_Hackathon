<text x="692.0" y="91.0" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, 'Segoe UI', Arial, sans-serif" text-anchor="middle">Bundle</text>
<text x="692.0" y="104.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">model_weights.pt</text>
<text x="692.0" y="116.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">15 models</text>
<text x="692.0" y="128.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', Consolas, 'Courier New', monospace" text-anchor="middle">cut-off 0.475</text>
