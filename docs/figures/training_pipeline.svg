<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" role="img" aria-labelledby="training-pipeline-title training-pipeline-desc">
<title id="training-pipeline-title">How the 15 models were trained</title>
<desc id="training-pipeline-desc">Training images are split into five folds with copies kept together, first models flag 508 wrong labels, then three families train on five folds for scoring and on all images for the final bundle.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M144,96 H171" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M284,96 H311" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M424,84 H434 Q442,84 442,76 V56 Q442,48 450,48 H459" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M424,108 H434 Q442,108 442,116 V136 Q442,144 450,144 H459" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
